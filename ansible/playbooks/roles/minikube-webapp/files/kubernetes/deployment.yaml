apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-challenge-deployment
  labels:
    app: sre-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-challenge
  template:
    metadata:
      labels:
        app: sre-challenge
    spec:
      containers:
        - name: sre-challenge
          image: sre-challenge:1.0
          imagePullPolicy: Never
          env:
            - name: app_secret
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: app_secret
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: sqlite-data
              mountPath: /var/lib/sre-challenge
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-pvc